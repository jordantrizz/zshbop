name: secrets

# The standing secret gate: every push and pull request is scanned with
# gitleaks, so a credential fails here instead of waiting for an audit.
#
# The allowlist lives in .gitleaks.toml and covers vendored third-party
# binaries and placeholder-only matches. It is deliberately not a baseline
# file: a baseline silently accepts the *next* finding, while an allowlist
# entry names exactly what is exempt and why.
#
# Both scans run. The working-tree scan catches a secret in the current tree;
# the history scan catches one that was committed and then deleted by a later
# commit, which is exactly how a leak survives review.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          workdir="$(mktemp -d)"
          cd "$workdir"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner --verbose

      - name: Scan the history
        run: gitleaks git . --redact --no-banner --verbose
